aid: immunitas-therapeutics
name: Immunitas Therapeutics
description: >-
  Immunitas Therapeutics is a Boston, Massachusetts clinical-stage biotechnology company that
  discovers and develops novel antibody therapeutics for patients with cancer and autoimmune
  disease. It was founded by cancer-research and therapeutic-antibody scientists from Dana-Farber
  Cancer Institute, Mass General Cancer Center, the Broad Institute and MIT, whose single-cell
  analysis drug-discovery platform identified CD161 as a T-cell target. The lead program, IMT-009,
  is an anti-CD161 antibody in a Phase 1/2a study in solid tumors and hematological malignancies;
  a second, preclinical anti-CD161 program (IMT-380) for chronic inflammatory disease was licensed
  to Boehringer Ingelheim in May 2026. Immunitas publishes no public API, developer portal or
  machine-readable API contract. Its only public software is open source research tooling from the
  immunitastx GitHub organization, notably the MIT-licensed Python package monkeybread for
  analyzing cellular niches in single-cell spatial transcriptomics data.
